name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      # Production runs on Postgres: migrations are tested against it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lehwi
          POSTGRES_PASSWORD: lehwi
          POSTGRES_DB: lehwi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lehwi -d lehwi_test"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://lehwi:lehwi@localhost:5432/lehwi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply and match the models
        env:
          DATABASE_URL: ${{ env.TEST_POSTGRES_URL }}
        run: alembic upgrade head && alembic check
      - run: pytest -q

  promoter-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/promoter-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/promoter-portal/package-lock.json
      - run: npm ci
      - run: npm run build

  customer-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
